name: Build & Test

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON-encoded build matrix from cpp-matrix'
        type: string
        required: true

env:
  GIT_FETCH_JOBS: 8
  NET_RETRY_COUNT: 5
  DEFAULT_BUILD_VARIANT: debug,release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}

    env: ${{ matrix.env }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Inline container bootstrap — we can't use ./container-bootstrap because
      # checkout hasn't happened yet (chicken-and-egg). This replicates the
      # essential steps: Node.js glibc patching, git installation, and
      # safe.directory configuration.
      - name: Container Bootstrap
        if: ${{ matrix.is-container }}
        run: |
          set -x
          # Install git if missing (needed for checkout and later git operations)
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y git
          fi
          # Configure safe.directory for containers (root user vs workspace owner)
          git config --global --add safe.directory '*'
          # Patch Node.js for old containers with glibc-217 volume mounts
          if [ -d /node20217 ] && [ -w /node20217 ]; then
            if ! /__e/node20/bin/node --version 2>/dev/null; then
              apt-get update 2>/dev/null || true
              apt-get install -y curl 2>/dev/null || true
              curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v20.9.0/node-v20.9.0-linux-x64-glibc-217.tar.gz" -o /tmp/node-glibc217.tar.gz
              tar -xzf /tmp/node-glibc217.tar.gz --strip-components 1 -C /node20217
              rm -f /tmp/node-glibc217.tar.gz
              /__e/node20/bin/node --version
            fi
          fi

      - name: Clone cpp-actions
        uses: actions/checkout@v4

      # Set up the compiler before package-install in case one of the packages needs a compiler
      - name: Setup C++
        uses: ./setup-cpp
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          # For GCC/Clang, we are iterating majors, so we get whatever major is available from the system
          # so that we get the version most likely to be installed by default.
          # For other libraries, any logic might be acceptable here.
          version: ${{ matrix.version }}
          trace-commands: true
          arch: ${{ matrix.arch }}

      - name: Install packages
        uses: ./package-install
        id: package-install
        with:
          vcpkg: ${{ matrix.vcpkg-packages }}
          vcpkg-triplet: ${{ matrix.triplet }}
          packages: ${{ matrix.install }}
          apt-get-ignore-missing: ${{ matrix.is-container }}
          cc: ${{ steps.setup-cpp.outputs.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          trace-commands: true

      - name: Clone Boost.Variant2
        uses: ./boost-clone
        id: boost-clone
        with:
          branch: master
          modules: variant2
          modules-scan-paths: 'test'
          modules-exclude-paths: ''
          trace-commands: true

      - name: B2 Workflow
        if: ${{ !matrix.has-factors && runner.os != 'Windows' }}
        uses: ./b2-workflow
        with:
          source-dir: ${{ steps.boost-clone.outputs.boost-dir }}
          modules: variant2
          toolset: ${{ matrix.b2-toolset }}
          build-variant: ${{ matrix.build-type }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || '' }}
          cxxstd: ${{ matrix.cxxstd }}
          address-model: ${{ matrix.address-model }}
          arch: ${{ matrix.arch }}
          asan: ${{ matrix.asan }}
          ubsan: ${{ matrix.ubsan }}
          tsan: ${{ matrix.tsan }}
          shared: ${{ matrix.shared }}
          trace-commands: true

      - name: CMake Workflow
        uses: ./cmake-workflow
        with:
          cmake-version: '>=3.20'
          source-dir: tests
          generator: ${{ matrix.generator }}
          generator-toolset: ${{ matrix.generator-toolset }}
          arch: ${{ matrix.arch }}
          toolchain: ${{ steps.package-install.outputs.vcpkg-toolchain }}
          build-type: ${{ matrix.build-type }}
          run-tests: true
          install-prefix: .local
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          ldflags: ${{ matrix.ldflags }}
          shared: ${{ matrix.shared }}
          extra-args: |
            ${{ ( !matrix.no-deps && format('-D BOOST_SRC_DIR="{0}"', steps.boost-clone.outputs.boost-dir) ) || '' }}
            ${{ ( matrix.no-deps && '-D CPP_ACTIONS_NO_DEPS=ON' ) || '' }}
          export-compile-commands: ${{ matrix.time-trace }}
          package: true
          package-artifact: ${{ matrix.is-main }}
          ref-source-dir: .
          trace-commands: true

      - name: FlameGraph
        uses: ./flamegraph
        if: matrix.time-trace
        with:
          source-dir: tests
          build-dir: tests/build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trace-commands: true

      - name: Process Coverage
        if: ${{ matrix.coverage }}
        uses: ./process-coverage
        with:
          cxx: ${{ steps.setup-cpp.outputs.cxx }}
          build-dir: tests/build
          include: tests/**
          html-report: true
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          codecov-flags: cpp
          coveralls-token: ${{ github.token }}
          trace-commands: true
