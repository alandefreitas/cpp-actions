name: "Setup CMake"
description: |
  Set up a specific version of CMake and add it to the PATH.

  This action will also set-up any dependencies required by CMake.

  This action uses a number of alternatives to find or install CMake:

  - The CMake path provided to 'path'
  - Any other version of CMake it can find in the system PATH
  - Any other version of CMake available from APT (Linux only)
  - A version of CMake downloaded from cmake.org

  When searching APT packages, the action prefers packages in this order:

  1. Unversioned packages (e.g., `cmake`) - best system integration
  2. Raw versioned packages (e.g., `cmake-3.24`) - if available
  3. Other versioned packages - fallback only

  In most workflows, this is used as an auxiliary action for the xref:actions/cmake-workflow.adoc[] action,
  which already calls this action if necessary.

  Note: `check-latest` only influences which version is fetched when a download is required. If the runner already
  provides a CMake build that satisfies the requested version range, that installation is reused instead of being
  replaced.

inputs:
  trace-commands:
    description: Trace commands executed by the workflow.
    required: false
    default: 'false'
  version:
    description: |-
      Version range or exact version of CMake to use, using SemVer's version range syntax.

      Reads from `cmake-file` input if unset.

      By default, it uses any version available in the environment.
    required: false
    default: '>=3.0.2'
  architecture:
    description: The target architecture (x86, x64). By default, this value is inferred.
    required: false
    default: ''
  cmake-file:
    description: |-
      File containing the CMake version to use in a cmake_minimum_required command.

      Example: A CMakeLists.txt file containing a call to cmake_minimum_required.
    required: false
    default: CMakeLists.txt
  path:
    description: |-
      Ordered list of candidate paths to the cmake executable.

      Each entry can be an absolute/relative file path or a basename:

      - If the entry is a file path, we try it as-is (and on Windows we also check `.exe`, `.cmd`, `.bat` if no extension was provided).
      - If the entry is just a basename (for example `cmake`), it is forwarded to the system PATH search so any existing installation is reused.

      Multiple entries can be provided by separating them with the platform path delimiter (`:` on Unix-like systems, `;` on Windows) or new lines. They are evaluated in order until an executable that satisfies the requested `version` range is located. To accept any version without filtering, set `version: '*'`.
    required: false
    default: cmake
  cmake-path:
    description: |-
      Alias for `path` preserved for backwards compatibility.

      When provided, these entries are evaluated before `path` using the same semantics, including the version check.
    required: false
    default: ''
  cache:
    description: |-
      Used to specify whether the CMake installation should be cached in the case CMake needs to be downloaded.

      As binaries are provided for all versions of CMake, this option is deprecated and will be removed in a future release.
    required: false
    default: 'true'
  check-latest:
    description: |-
      By default, when CMake is not available, this action will install the minimum version in the version spec.
      This ensures the code respects its contract in terms of what minimum CMake version is supported.

      Set this option if you want the action to check for the latest available version that satisfies the version spec instead.
    required: false
    default: 'false'
  update-environment:
    description: Set this option if you want the action to update environment variables.
    required: false
    default: 'true'

outputs:
  path:
    description: The absolute path to the CMake executable.
  dir:
    description: The absolute path to the CMake directory.
  version:
    description: The installed CMake version. Useful when given a version range as input.
  version-major:
    description: The installed CMake version major. Useful when given a version range as input.
  version-minor:
    description: The installed CMake version minor. Useful when given a version range as input.
  version-patch:
    description: The installed CMake version patch. Useful when given a version range as input.
  cache-hit:
    description: A boolean value to indicate a cache entry was found
  supports-path-to-build:
    description: Whether CMake supports the -B <path-to-build> syntax
  supports-parallel-build:
    description: Whether CMake supports the -j <threads> syntax
  supports-build-multiple-targets:
    description: Whether CMake supports the --target with multiple targets
  supports-cmake-install:
    description: Whether CMake supports the cmake --install

runs:
  using: 'node24'
  main: 'dist/index.js'
  post-if: success()
branding:
  icon: 'code'
  color: 'yellow'
